<!DOCTYPE html>
<html>
<head>
  <title>Add User</title>
</head>
<body>
  <h1>Add New User</h1>
  <form id="userForm">
    <input type="number" id="id" placeholder="User ID"><br><br>
    <input type="text" id="name" placeholder="User Name"><br><br>
    <button type="submit">Add User</button>
  </form>

  <script>
    document.getElementById('userForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const id = document.getElementById('id').value;
      const name = document.getElementById('name').value;

      console.log("Отправляем JSON:", { id, name }); // ЛОГ на фронте

      try {
        const response = await fetch('/users', { // <-- тут "/" чтобы работало и локально, и на Railway
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name })
        });

        const result = await response.json();
        console.log("Ответ сервера:", result);
        alert(JSON.stringify(result));
      } catch (error) {
        console.error('Ошибка запроса:', error);
      }
    });
  </script>
</body>
</html>
